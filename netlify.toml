# Site statique : aucun build, on publie le dossier tel quel.
[build]
  publish = "."

# Fonctions serveur (proxy Remove.bg) — la clé est dans les variables d'environnement Netlify
[functions]
  directory = "netlify/functions"

# Application installable : le service worker doit toujours être revalidé
[[headers]]
  for = "/sw.js"
  [headers.values]
    Cache-Control = "no-cache"

[[headers]]
  for = "/manifest.webmanifest"
  [headers.values]
    Content-Type = "application/manifest+json"
